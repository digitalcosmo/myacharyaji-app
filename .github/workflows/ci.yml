name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (repo only tracks lib/)
        run: flutter create . --project-name myacharyaji --org com.cosmoguru --platforms=android,ios,web

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat analyze.txt

      - name: Build debug APK
        id: apk
        run: |
          set +e
          flutter build apk --debug > build.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -40 build.txt

      - name: Upload APK
        if: steps.apk.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: myacharyaji-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish results to ci-results branch
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "analyze_exit: ${{ steps.analyze.outputs.code }}"
            echo "apk_exit: ${{ steps.apk.outputs.code }}"
            flutter --version
            echo "===== ANALYZE ====="
            cat analyze.txt
            echo "===== BUILD (tail) ====="
            tail -60 build.txt
          } > /tmp/ci-report.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-results-tmp
          git rm -rf --cached . -q
          cp /tmp/ci-report.txt ci-report.txt
          git add ci-report.txt
          git commit -m "CI report for ${GITHUB_SHA::7}" -q
          git push -f origin HEAD:ci-results

      - name: Fail if analyze or build failed
        if: steps.analyze.outputs.code != '0' || steps.apk.outputs.code != '0'
        run: exit 1
