name: myacharyaji
description: MyAcharyaji — Your personal astrology companion
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: '>=0.19.0 <1.0.0'

  # Utils
  url_launcher: ^6.2.2
  smart_auth: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

