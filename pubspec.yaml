name: myacharyaji
description: MyAcharyaji — Your personal astrology companion
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0

  # Utils
  url_launcher: ^6.2.2
  package_info_plus: ^5.0.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: LexendGiga
      fonts:
        - asset: assets/fonts/LexendGiga-Regular.ttf
        - asset: assets/fonts/LexendGiga-Bold.ttf
          weight: 700
